
<!DOCTYPE html>
<html>
<head>
    <title>Write a Product Review</title>
</head>
<body>
    <h1>Write a Review</h1>

    <h2>{{ product.name }}</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Review
        </button>
    </form>

    <p>
        Rate this product from 1 to 5.
    </p>

    <a href="{% url 'product_list' %}">
        Back to Store
    </a>
</body>
</html>
