<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
</head>
<body>
    <h1>Forgot Your Password?</h1>

    <p>
        Enter your email address below,
        and we'll send you instructions
        to reset your password.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Reset Password
        </button>
    </form>

    <p>
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </p>
</body>
</html>
