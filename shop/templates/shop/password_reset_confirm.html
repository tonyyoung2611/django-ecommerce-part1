<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>
</head>
<body>
    <h1>Set Your New Password</h1>

    {% if validlink %}
        <p>
            Enter your new password below.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Change Password
            </button>
        </form>
    {% else %}
        <p>
            This password reset link is invalid
            or has expired.
        </p>

        <p>
            <a href="{% url 'password_reset' %}">
                Request a New Password Reset
            </a>
        </p>
    {% endif %}
</body>
</html>
